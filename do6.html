<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
    <link rel="shortcut icon" href="imagens/dogf.png" type="image/x-icon">
</head>
<body>

    <h1>Formatação padrão (ABNT)</h1>
    
    <h3>Passe o mouse sober os elementos</h3>

    <ul>
        <li><abbr title="Tamanho: A4
Cor: branca">Página</abbr></li>
        <li><abbr title="Tipo: Arial ou Times New Roman
Tamanho:
12 → texto normal
10 → citações longas, notas de rodapé">Fonte</abbr></li>
        <li><abbr title="Superior: 3 cm
Esquerda: 3 cm
Inferior: 2 cm
Direita: 2 cm">Margens</abbr></li>
        <li><abbr title="Entre linhas: 1,5
Parágrafos: espaço normal (sem espaço extra entre eles)">Espaçamento</abbr></li>
        <li><abbr title="Recuo da primeira linha: 1,25 cm e
Alinhamento: justificado">Parágrafo</abbr></li>
        <li><abbr title="Começa a contar na folha de rosto
Aparece a partir da introdução
Posição: canto superior direito">Numeração de páginas</abbr></li>
        <li><abbr title="Alinhados à esquerda
Em negrito
Sem ponto final">Títulos e seções</abbr></li>
        <li><abbr title="Recuo: 4 cm da margem esquerda
Fonte: tamanho 10
Espaçamento: simples
Sem aspas">Citação longa (mais de 3 linhas)</abbr></li>
        <li><abbr title="Fonte tamanho 10
Espaçamento simples">Notas de rodapé</abbr></li>
    </ul>

</body>
</html>
