<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralização vertical de caixas</title>
    <style>
        #container {
            background-image: url(imagens2/mira.png);
            background-size: 100% 100%;
            position: relative;
            height: 66vh;
            width: 800px;
            padding: 10px;
            background-color: blue;
        }

        #conteúdo {
            background-image: url(imagens2/mira.png);
            background-size: 100% 100%;
            position: absolute;
            height: 200px;
            width: 400px;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
            background-color: gold;
           
        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteúdo">

        </article>
    </section>
</body>
</html>
